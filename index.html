<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Trailer</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player, iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="player"></div>
<script>
/*
 * Trailer page for Tifa's IPTV Player. YouTube refuses to play inside the packaged TV app
 * (error 153: a file:// page sends no referrer), so the app shows this page in a frame and the
 * page hosts YouTube's own player. It tells the app what the player does and accepts play/pause
 * and seek commands. Address: <this page>?v=<11-character YouTube video id>. No data is stored.
 */
(function () {
  var match = /[?&]v=([A-Za-z0-9_-]{11})(?:&|$)/.exec(location.search);
  var player = null;

  function tell(event, extra) {
    var msg = { tifaTrailer: 1, event: event };
    for (var k in extra || {}) msg[k] = extra[k];
    if (window.parent !== window) window.parent.postMessage(msg, '*');
  }

  if (!match) {
    tell('error', { code: 2 });
    return;
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      videoId: match[1],
      host: 'https://www.youtube-nocookie.com',
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, playsinline: 1, rel: 0 },
      events: {
        onReady: function () {
          player.playVideo();
          tell('ready');
        },
        onStateChange: function (e) {
          var state = { '0': 'ended', '1': 'playing', '2': 'paused' }[String(e.data)];
          if (state) tell(state, { t: player.getCurrentTime(), d: player.getDuration() });
        },
        onError: function (e) {
          tell('error', { code: e.data });
        }
      }
    });
  };

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!player || !player.getPlayerState || !d || d.tifaTrailer !== 1) return;
    if (d.cmd === 'toggle') {
      if (player.getPlayerState() === 1) player.pauseVideo();
      else player.playVideo();
    } else if (d.cmd === 'seek' && typeof d.by === 'number') {
      player.seekTo(Math.max(0, player.getCurrentTime() + d.by), true);
    }
  });

  var api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  api.onerror = function () {
    tell('error', { code: 'api' });
  };
  document.head.appendChild(api);
})();
</script>
</body>
</html>
